[package]
name = "sphinx"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Companion input tool for AuctiMogger: watches the pixel semaphore, actuates the native auction buy UI with trusted hardware-level input."

[lints.rust]
missing_docs = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "deny"
string_slice = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "warn"

[features]
# vkbm on by default: the tool's home machine runs the RP2040 board, so a
# plain `cargo run` actuates through it. The pure build is
# `--no-default-features`; serial stays opt-in.
default = ["vkbm"]
serial = ["dep:serialport"]
vkbm = ["dep:hidapi"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
enigo = "0.6"
hidapi = { version = "2", optional = true }
serialport = { version = "4", optional = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
